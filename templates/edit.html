<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Cake</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="center"><form class="login wide" method="post" enctype="multipart/form-data"><div class="brand">VEERA’S CAKE</div><h2>Edit Cake</h2><input name="name" value="{{cake['name']}}" required><input name="category" value="{{cake['category']}}" required><input name="price" value="{{cake['price']}}" required><input name="weight" value="{{cake['weight'] or ''}}"><textarea name="description" placeholder="Description">{{cake['description'] or ''}}</textarea><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><button>Save Changes</button><a href="{{url_for('admin')}}">← Back to Admin</a></form></body></html>
